<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coinflip</title>
    <link rel="stylesheet" href="styles/coinflip-style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="icon" href="images/icons/icon.png">
</head>
<body>
    <nav>
        <div class="nav-top">
            <div class="langage-switcher" style="display: flex; gap: 10px; cursor: pointer; align-items: center;">
                <img src="images/icons/cz-flag.png" alt="CZ" width="24" onclick="changeLanguage('cs')">
                <img src="images/icons/en-flag.png" alt="ENG" width="24" onclick="changeLanguage('en')">
            </div>
            <div class="currency-display"><span class="lang" data-en="Tokens:" data-cs="Žetony:">Tokens:</span> <span id="currency"></span> tkn</div>          
            <button id="menu-toggle" class="burger" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
                <span></span><span></span><span></span>
            </button>
        </div>

        <ul id="nav-links" class="nav-links">
            <li><a href="index.html" class="lang" data-en="Home" data-cs="Domů">Home</a></li>
            <li><a href="coinflip.html" class="active lang" data-en="Coinflip" data-cs="Hod mincí">Coinflip</a></li>
            <li><a href="roulette.html" class="notUnlocked lang" data-en="Roulette" data-cs="Ruleta">Roulette</a></li>
            <li><a href="blackjack.html" class="notUnlocked lang" data-en="Blackjack" data-cs="Blackjack">Blackjack</a></li>
            <li><a href="plinko.html" class="notUnlocked lang" data-en="Plinko" data-cs="Plinko">Plinko</a></li>
        </ul>
    </nav>

    <header>
        <h1 class="lang" data-en="Coinflip" data-cs="Hod mincí">Coinflip</h1>
    </header>

    <div class="game-container">

        <div class="coin-section">
            <div class="coin-container">
                <div id="coin" class="coin">
                    <div class="side front"></div>
                    <div class="side back"></div>
                </div>
            </div>
            <div id="result-message" class="message lang" data-en="Pick a side!" data-cs="Vyber si stranu!">Pick a side!</div>
        </div>

        <div class="controls-section">
            <div class="popup" onclick="startTutorial()">
                <p><img src="images/icons/tutorial.png" alt="Question Icon" class="icon-question"><span class="lang" data-en="Tutorial" data-cs="Jak hrát">Tutorial</span></p>
            </div>
            <div id="betting-controls" class="betting-panel">
                <label class="lang" data-en="Bet Amount:" data-cs="Výše sázky:">Bet Amount:</label>
                <input type="number" id="bet-amount" min="1" placeholder="Amount">
                
                <div class="bet-presets">
                    <button type="button" class="preset-btn lang" data-value="1" data-en="Min" data-cs="Min">Min</button>
                    <button type="button" class="preset-btn" data-value="10">10</button>
                    <button type="button" class="preset-btn" data-value="100">100</button>
                    <button type="button" class="preset-btn" data-value="1000">1000</button>
                    <button type="button" class="preset-btn lang" data-value="max" data-en="Max" data-cs="Max">Max</button>
                </div>

                <div class="bet-adjusters">
                    <button type="button" class="adjust-btn" onclick="adjustBet(-5)">- 5</button>
                    <button type="button" class="adjust-btn" onclick="adjustBet(5)">+ 5</button>
                </div>

                <div class="action-buttons">
                    <button id="red-btn" class="choice-btn red-btn lang" data-en="BET RED" data-cs="VSADIT ČERVENOU">BET RED</button>
                    <button id="blue-btn" class="choice-btn blue-btn lang" data-en="BET BLUE" data-cs="VSADIT MODROU">BET BLUE</button>
                </div> 

            </div>
        </div>
    </div>

    <div id="tutorial-overlay" class="tutorial-overlay">
        <div id="highlight-box" class="highlight-box"></div>
        <div id="tutorial-box" class="tutorial-box">
            <h3 id="tut-title">Welcome!</h3>
            <p id="tut-text">Tutorial text...</p>
            <div class="tut-buttons">
                <button onclick="endTutorial()" class="tut-btn-skip lang" data-en="Skip" data-cs="Přeskočit">Skip</button>
                <button onclick="nextStep()" class="tut-btn-next">Next</button>
            </div>
        </div>
    </div>

    <script src="scripts/currency.js"></script>
    <script src="scripts/coinflip-script.js"></script>

    <script>
        updateTokenDisplay();

        // navbar logic
        const nav = document.querySelector('nav');
        const burger = document.getElementById('menu-toggle');
        if (burger) {
            burger.addEventListener('click', () => {
                const isOpen = nav.classList.toggle('open');
                burger.setAttribute('aria-expanded', isOpen);
            });
        }

        // --- MULTILANGUAGE ---
        function changeLanguage(lang) {
            localStorage.setItem('selectedLang', lang);
            const elements = document.querySelectorAll('.lang');
            elements.forEach(el => {
                const translation = el.getAttribute(`data-${lang}`);
                if (translation) {
                    el.innerHTML = translation;
                }
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem('selectedLang') || 'en';
            changeLanguage(savedLang);
        });

        //tutorial logic
        let currentStep = 0;
        const overlay = document.getElementById('tutorial-overlay');
        const box = document.getElementById('tutorial-box');
        const highlight = document.getElementById('highlight-box');
        const title = document.getElementById('tut-title');
        const text = document.getElementById('tut-text');
        const nextBtn = document.querySelector('.tut-btn-next');

        const steps = [
            {
                target: null,
                title: { en: "Welcome to Coinflip!", cs: "Vítej u Hodu mincí!" },
                text: { en: "In this game, you can bet your tokens on either Red or Blue. If the coin lands on your chosen color, you double your bet!", cs: "V této hře můžeš vsadit své žetony na červenou nebo modrou barvu. Pokud mince padne na tvou barvu, zdvojnásobíš svou sázku!" }
            },
            {
                target: "#bet-amount",
                title: { en: "Place Your Bet", cs: "Vsaď si" },
                text: { en: "Enter the amount of tokens you want to wager here. The maximum bet is half your total tokens.", cs: "Zde zadej počet žetonů, které chceš vsadit. Maximální sázka je polovina tvých celkových žetonů." }
            },
            {
                target: ".bet-presets",
                title: { en: "Bet Presets", cs: "Rychlé sázky" },
                text: { en: "Use these buttons to quickly set your bet amount to common values.", cs: "Pomocí těchto tlačítek si rychle nastavíš výchozí hodnoty sázek." }
            },
            {
                target: ".coin-section",
                title: { en: "Playing the Game", cs: "Hrací plocha" },
                text: { en: "Here's where the action happens! You can see the coin flip animation here.", cs: "Tady se to celé odehrává! Zde uvidíš animaci házení mincí." }
            },
            {
                target: ".action-buttons",
                title: { en: "Make Your Choice", cs: "Vyber si" },
                text: { en: "Click either the RED or BLUE button to place your bet and flip the coin!", cs: "Klikni na ČERVENÉ nebo MODRÉ tlačítko pro umístění sázky a hození mincí!" }
            },
            {
                target: null,
                title: { en: "Good Luck!", cs: "Hodně štěstí!" },
                text: { en: "That's the end of the tutorial. Good luck and have fun playing Coinflip!", cs: "To je konec návodu. Hodně štěstí a bav se hrou!" }
            }
        ];

        function preventDefault(e) {
            e.preventDefault();
        }

        function disableUserScroll() {
            window.addEventListener('wheel', preventDefault, { passive: false });
            window.addEventListener('touchmove', preventDefault, { passive: false });
            window.addEventListener('keydown', preventDefaultForScrollKeys, { passive: false });
        }

        function enableUserScroll() {
            window.removeEventListener('wheel', preventDefault, { passive: false });
            window.removeEventListener('touchmove', preventDefault, { passive: false });
            window.removeEventListener('keydown', preventDefaultForScrollKeys, { passive: false });
        }

        function preventDefaultForScrollKeys(e) {
            const keys = {37: 1, 38: 1, 39: 1, 40: 1, 32: 1, 33: 1, 34: 1, 35: 1, 36: 1};
            if (keys[e.keyCode]) {
                preventDefault(e);
                return false;
            }
        }

        function startTutorial() {
            currentStep = 0;
            overlay.style.display = "block";
            disableUserScroll();
            showStep(currentStep);
        }

        function endTutorial() {
            overlay.style.display = "none";
            enableUserScroll();
            currentTargetEl = null;
        }

        function nextStep() {
            currentStep++;
            if (currentStep >= steps.length) {
                endTutorial();
            } else {
                showStep(currentStep);
            }
        }

        let currentTargetEl = null;

        function updateHighlightPosition() {
            if (!currentTargetEl) return;
            
            const rect = currentTargetEl.getBoundingClientRect();
            
            highlight.style.width = (rect.width + 10) + "px";
            highlight.style.height = (rect.height + 10) + "px";
            highlight.style.top = (rect.top - 5) + "px";
            highlight.style.left = (rect.left - 5) + "px";

            box.style.position = 'fixed';
            box.style.transform = "translateX(-50%)";
            box.style.left = "50%";
            
            const boxHeight = box.offsetHeight || 200; 
            const spaceAbove = rect.top;
            const spaceBelow = window.innerHeight - rect.bottom;
            
            if (spaceBelow > boxHeight + 20) {
                box.style.top = (rect.bottom + 20) + "px";
            } else if (spaceAbove > boxHeight + 20) {
                box.style.top = (rect.top - boxHeight - 20) + "px";
            } else {
                box.style.top = "50%";
                box.style.transform = "translate(-50%, -50%)";
            }
        }

        function showStep(index) {
            const step = steps[index];
            const currentLang = localStorage.getItem('selectedLang') || 'en';

            title.innerText = step.title[currentLang];
            text.innerText = step.text[currentLang];
            
            if (index === steps.length - 1) {
                nextBtn.innerText = currentLang === 'cs' ? "Hrát!" : "Play!";
            } else {
                nextBtn.innerText = currentLang === 'cs' ? "Další" : "Next";
            }

            if (step.target) {
                const targetEl = document.querySelector(step.target);
                if (targetEl) {
                    currentTargetEl = targetEl;
                    highlight.style.display = "block";
                    targetEl.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
                    setTimeout(() => {
                        updateHighlightPosition();
                    }, 500); 
                    updateHighlightPosition();
                }
            } else {
                currentTargetEl = null;
                highlight.style.display = "none";
                box.style.position = 'fixed';
                box.style.top = "50%";
                box.style.left = "50%";
                box.style.transform = "translate(-50%, -50%)";
            }
        }

        window.addEventListener('resize', () => {
            if (overlay.style.display === "block") {
                if(currentTargetEl) {
                    currentTargetEl.scrollIntoView({ block: "center", inline: "center" });
                    setTimeout(updateHighlightPosition, 100);
                } else {
                    updateHighlightPosition();
                }
            }
        });
    </script>
</body>
</html>
